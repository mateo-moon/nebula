apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: primary-disk
  namespace: guests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guests-primary-disk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: guests-primary-disk
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - |
              set -eu
              dir=/var/lib/guests/disks
              file=$dir/primary-data-v3.img
              device=/dev/loop203
              size=1099511627776
              umask 077
              exec 9>"$dir/provision.lock"
              flock -x 9
              [ ! -L "$file" ] || { echo 'refusing backing-file symlink'; exit 1; }
              if [ ! -e "$file" ]; then
                # Noclobber fails if the path appeared after the existence check.
                (set -C; : > "$file")
                fallocate -l "$size" "$file"
              fi
              [ -f "$file" ] && [ "$(stat -c %s "$file")" = "$size" ] && [ "$(stat -c %h "$file")" = 1 ] || {
                echo 'refusing changed backing file'; exit 1;
              }
              if [ ! -e "$device" ]; then mknod "$device" b 7 203; fi
              [ -b "$device" ] && [ ! -L "$device" ] && [ "$(stat -c '%t:%T' "$device")" = '7:cb' ] || {
                echo 'refusing wrong loop device'; exit 1;
              }
              # -j compares the actual backing file identity (device/inode), rather than
              # d_path output, which changes when the previous helper mount namespace exits.
              associated=$(losetup -j "$file" -n -O NAME)
              current=$(losetup -n -O BACK-FILE "$device" 2>/dev/null || true)
              if [ -n "$current" ]; then
                [ "$associated" = "$device" ] || { echo 'loop slot occupied; refusing'; exit 1; }
              else
                [ -z "$associated" ] || { echo 'backing file attached elsewhere; refusing'; exit 1; }
                losetup "$device" "$file"
              fi
              [ "$(losetup -j "$file" -n -O NAME)" = "$device" ] || exit 1
              # Pin the owned block-node metadata passed by CRI into the measured guest.
              chown 0:6 "$device"
              chmod 0660 "$device"
              flock -u 9
              echo 'dedicated retained 1Ti block volume ready'
              while :; do sleep 60; done
          command:
            - /bin/sh
            - -ec
          image: ghcr.io/example/confidential-guests-tools@sha256:6666666666666666666666666666666666666666666666666666666666666666
          name: provisioner
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(losetup -j /var/lib/guests/disks/primary-data-v3.img -n -O NAME)" = /dev/loop203
            periodSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /dev
              name: dev
            - mountPath: /var/lib/guests/disks
              name: backing
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-pull
      nodeName: tee-node-1
      volumes:
        - hostPath:
            path: /dev
            type: Directory
          name: dev
        - hostPath:
            path: /var/lib/guests/disks
            type: DirectoryOrCreate
          name: backing
---
