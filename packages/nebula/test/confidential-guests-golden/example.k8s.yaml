apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: pull-broker-configuration
  namespace: guests
data:
  config.toml: |
    [http_server]
    insecure_http = true
    sockets = ["0.0.0.0:8080"]

    [attestation_token]
    insecure_header_jwk = false
    trusted_certs_paths = ["/state/issuer/cert.pem"]

    [attestation_service]
    type = "coco_as_builtin"

    [attestation_service.attestation_token_broker]
    duration_min = 5

    [attestation_service.attestation_token_broker.signer]
    key_path = "/state/issuer/key.pem"
    cert_path = "/state/issuer/cert.pem"

    [attestation_service.rvps_config]
    type = "BuiltIn"

    [attestation_service.verifier_config.snp_verifier]
    vcek_sources = [{ type = "KDS" }]

    [admin]
    authorization_mode = "DenyAll"

    [storage_backend]
    storage_type = "LocalFs"
    [storage_backend.backends.local_fs]
    dir_path = "/state"

    [[plugins]]
    name = "resource"
    storage_backend_type = "kvstorage"
  resource-policy.rego: |
    package policy
    default allow := false
    allow if {
        data.plugin == "resource"
        data["resource-path"] == ["default", "registry", "pull"]
        ev := input.submods.cpu0["ear.veraison.annotated-evidence"]
        ev.init_data in ["cf0a41d3ef41f212a569890cc7e654d53c5b14c2cb6951e69b56563016b3c841","e47e5deb9d53cf9c67f88b97c0e58921ae65f27b86be21c418acbbeb5397519c"]
        ev.snp.policy_debug_allowed == false
    }
---
