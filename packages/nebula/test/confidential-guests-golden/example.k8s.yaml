---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: pull-broker
  namespace: confidential-guests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confidential-guests-pull-broker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        guests.example.com/config-sha256: 369da533e7a3eb2d2c3bd969706b3ca872cd52d622defbbe3eaae113e7da22ef
      labels:
        app: confidential-guests-pull-broker
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /usr/local/bin/kbs
            - --config-file
            - /configuration/config.toml
          env:
            - name: RUST_LOG
              value: info
          image: registry.example.com/guests/kbs@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          name: broker
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            periodSeconds: 2
            tcpSocket:
              port: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /configuration
              name: configuration
              readOnly: true
            - mountPath: /state/repository
              name: registry-resource
              readOnly: true
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - command:
            - python3
            - -m
            - confidential_guests.registry_init
          image: registry.example.com/guests/tools@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          name: initialize-registry
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /registry
              name: registry
              readOnly: true
            - mountPath: /configuration
              name: configuration
              readOnly: true
      nodeName: guest-host-1
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 64Mi
          name: state
        - name: registry
          secret:
            defaultMode: 256
            secretName: registry-pull
        - configMap:
            name: pull-broker-configuration
          name: configuration
        - name: registry-resource
          secret:
            defaultMode: 256
            items:
              - key: .dockerconfigjson
                path: default\x2Fregistry\x2Fpull
            secretName: registry-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: data-provisioner
  namespace: confidential-guests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confidential-guests-data-provisioner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: confidential-guests-data-provisioner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - |
              set -eu
              dir=/var/lib/confidential-guests
              file=$dir/data-v3.img
              device=/dev/loop203
              size=68719476736
              umask 077
              exec 9>"$dir/provision.lock"
              flock -x 9
              [ ! -L "$file" ] || { echo 'refusing backing-file symlink'; exit 1; }
              if [ ! -e "$file" ]; then
                # Noclobber fails if the path appeared after the existence check.
                (set -C; : > "$file")
                fallocate -l "$size" "$file"
              fi
              [ -f "$file" ] && [ "$(stat -c %s "$file")" = "$size" ] && [ "$(stat -c %h "$file")" = 1 ] || {
                echo 'refusing changed backing file'; exit 1;
              }
              if [ ! -e "$device" ]; then mknod "$device" b 7 203; fi
              [ -b "$device" ] && [ ! -L "$device" ] && [ "$(stat -c '%t:%T' "$device")" = '7:cb' ] || {
                echo 'refusing wrong loop device'; exit 1;
              }
              # -j compares the actual backing file identity (device/inode), rather than
              # d_path output, which changes when the previous helper mount namespace exits.
              associated=$(losetup -j "$file" -n -O NAME)
              current=$(losetup -n -O BACK-FILE "$device" 2>/dev/null || true)
              if [ -n "$current" ]; then
                [ "$associated" = "$device" ] || { echo 'loop slot occupied; refusing'; exit 1; }
              else
                [ -z "$associated" ] || { echo 'backing file attached elsewhere; refusing'; exit 1; }
                losetup "$device" "$file"
              fi
              [ "$(losetup -j "$file" -n -O NAME)" = "$device" ] || exit 1
              # Pin the owned block-node metadata passed by CRI into the measured guest.
              chown 0:6 "$device"
              chmod 0660 "$device"
              flock -u 9
              echo 'dedicated retained 64Gi block volume ready'
              while :; do sleep 60; done
          command:
            - /bin/sh
            - -ec
          image: registry.example.com/guests/storage@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          name: provisioner
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(losetup -j /var/lib/confidential-guests/data-v3.img -n -O NAME)" = /dev/loop203
            periodSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /dev
              name: dev
            - mountPath: /var/lib/confidential-guests
              name: backing
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-pull
      nodeName: guest-host-1
      volumes:
        - hostPath:
            path: /dev
            type: Directory
          name: dev
        - hostPath:
            path: /var/lib/confidential-guests
            type: DirectoryOrCreate
          name: backing
---
