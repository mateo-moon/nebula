apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: ingress-boundary
  namespace: confidential-guests
spec:
  ingress: []
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: pull-broker-from-guests
  namespace: confidential-guests
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: confidential-guest
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app: confidential-guests-pull-broker
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: pull-broker-configuration
  namespace: confidential-guests
data:
  config.toml: |
    [http_server]
    insecure_http = true
    sockets = ["0.0.0.0:8080"]

    [attestation_token]
    insecure_header_jwk = false
    trusted_certs_paths = ["/state/issuer/cert.pem"]

    [attestation_service]
    type = "coco_as_builtin"

    [attestation_service.attestation_token_broker]
    duration_min = 5

    [attestation_service.attestation_token_broker.signer]
    key_path = "/state/issuer/key.pem"
    cert_path = "/state/issuer/cert.pem"

    [attestation_service.rvps_config]
    type = "BuiltIn"

    [attestation_service.verifier_config.snp_verifier]
    vcek_sources = [{ type = "KDS" }]

    [admin]
    authorization_mode = "DenyAll"

    [storage_backend]
    storage_type = "LocalFs"
    [storage_backend.backends.local_fs]
    dir_path = "/state"

    [[plugins]]
    name = "resource"
    storage_backend_type = "kvstorage"
  resource-policy.rego: |
    package policy
    default allow := false
    allow if {
        data.plugin == "resource"
        data["resource-path"] == ["default", "registry", "pull"]
        ev := input.submods.cpu0["ear.veraison.annotated-evidence"]
        ev.init_data in ["d11f43ae520d1063a82d0b89ce2a7618e37b544a571c1b978cf1c55d1e23e6d8","dad0480c532d12882e6b3b313323223992e27bf11dacb623629f921eea743867"]
        ev.snp.policy_debug_allowed == false
    }
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: pull-broker
