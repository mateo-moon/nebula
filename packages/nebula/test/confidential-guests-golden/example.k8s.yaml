---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-2"
  name: operator-lifecycle-ledger
  namespace: guests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: operator-lifecycle
  namespace: guests
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: operator-lifecycle
  namespace: guests
rules:
  - apiGroups:
      - ""
    resourceNames:
      - guest-operator
    resources:
      - pods
    verbs:
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - operator-lifecycle-spec
    resources:
      - configmaps
    verbs:
      - get
  - apiGroups:
      - ""
    resourceNames:
      - operator-lifecycle-ledger
    resources:
      - configmaps
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: operator-lifecycle
  namespace: guests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-lifecycle
subjects:
  - kind: ServiceAccount
    name: operator-lifecycle
    namespace: guests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: operator-lifecycle
  namespace: guests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guests-operator-lifecycle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: guests-operator-lifecycle
    spec:
      automountServiceAccountToken: true
      containers:
        - command:
            - python3
            - -I
            - -B
            - -m
            - confidential_guests.lifecycle
          env:
            - name: LIFECYCLE_ROLE
              value: operator
            - name: LIFECYCLE_NAMESPACE
              value: guests
          image: ghcr.io/example/confidential-guests-control@sha256:5555555555555555555555555555555555555555555555555555555555555555
          name: controller
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
      enableServiceLinks: false
      nodeName: tee-node-1
      serviceAccountName: operator-lifecycle
      terminationGracePeriodSeconds: 15
