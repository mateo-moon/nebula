  replicas: 1
  selector:
    matchLabels:
      app: guests-pull-broker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        guests.example.com/config-sha256: b36b088228d68703b2daac6981ca1fe0537ff3749b346e8f93749ad703367124
      labels:
        app: guests-pull-broker
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /usr/local/bin/kbs
            - --config-file
            - /configuration/config.toml
          env:
            - name: RUST_LOG
              value: info
          image: ghcr.io/example/kbs@sha256:8888888888888888888888888888888888888888888888888888888888888888
          name: broker
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            periodSeconds: 2
            tcpSocket:
              port: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /configuration
              name: configuration
              readOnly: true
            - mountPath: /state/repository
              name: registry-resource
              readOnly: true
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - command:
            - python3
            - -m
            - confidential_guests.registry_init
          image: ghcr.io/example/confidential-guests-tools@sha256:6666666666666666666666666666666666666666666666666666666666666666
          name: initialize-registry
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /registry
              name: registry
              readOnly: true
            - mountPath: /configuration
              name: configuration
              readOnly: true
      nodeName: tee-node-1
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 64Mi
          name: state
        - name: registry
          secret:
            defaultMode: 256
            secretName: registry-pull
        - configMap:
            name: pull-broker-configuration
          name: configuration
        - name: registry-resource
          secret:
            defaultMode: 256
            items:
              - key: .dockerconfigjson
                path: default\x2Fregistry\x2Fpull
            secretName: registry-pull
