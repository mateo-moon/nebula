roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maintenance-lifecycle
subjects:
  - kind: ServiceAccount
    name: maintenance-lifecycle
    namespace: guests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: maintenance-lifecycle
  namespace: guests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guests-maintenance-lifecycle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: guests-maintenance-lifecycle
    spec:
      automountServiceAccountToken: true
      containers:
        - command:
            - python3
            - -m
            - confidential_guests.lifecycle
          env:
            - name: LIFECYCLE_ROLE
              value: maintenance
            - name: LIFECYCLE_NAMESPACE
              value: guests
            - name: LIFECYCLE_NODE_NAME
              value: tee-node-1
            - name: LIFECYCLE_RUNTIME_CLASS
              value: kata-qemu-snp
            - name: LIFECYCLE_LABEL_DOMAINS
              value: '["guests.example.com"]'
          image: ghcr.io/example/confidential-guests-control@sha256:5555555555555555555555555555555555555555555555555555555555555555
          name: controller
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
      enableServiceLinks: false
      nodeName: tee-node-1
      serviceAccountName: maintenance-lifecycle
      terminationGracePeriodSeconds: 15
