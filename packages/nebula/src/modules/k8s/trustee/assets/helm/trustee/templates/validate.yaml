{{- if and .Values.kbs.managedConfig (not .Values.as.enabled) }}
{{- fail "kbs.managedConfig requires as.enabled; supply your own config/command for built-in AS" }}
{{- end }}
{{- if and .Values.as.enabled (not .Values.rvps.enabled) }}
{{- fail "the separate AS requires rvps.enabled" }}
{{- end }}
{{- if and (not .Values.secrets.enabled) (or .Values.kbs.managedConfig .Values.as.enabled) }}
{{- fail "secrets.enabled=false requires kbs.managedConfig=false and as.enabled=false" }}
{{- end }}
{{- if and (not .Values.kbs.managedConfig) (not .Values.kbs.command) }}
{{- fail "kbs.command is required when kbs.managedConfig=false" }}
{{- end }}
{{- if and (not .Values.kbs.managedConfig) .Values.kbs.tls.enabled }}
{{- fail "kbs.tls config is chart-managed; configure TLS in your own command when kbs.managedConfig=false" }}
{{- end }}
