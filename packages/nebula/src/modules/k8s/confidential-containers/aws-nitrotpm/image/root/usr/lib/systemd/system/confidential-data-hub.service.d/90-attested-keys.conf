[Unit]
Requires=aws-trustee-bootstrap.service
After=aws-trustee-bootstrap.service
BindsTo=run-nebula-secrets.mount

[Service]
ExecStart=
ExecStart=/usr/local/bin/confidential-data-hub -c /usr/share/nebula/cdh.toml
Environment=OFFLINE_FS_KBC_EXTRA_FILE_PATH=/run/nebula/secrets/resources.json
Environment=AA_KBC_PARAMS=offline_fs_kbc::null
Environment=CDH_DEFAULT_IMAGE_AUTHENTICATED_REGISTRY_CREDENTIALS=
LimitCORE=0
StandardOutput=null
StandardError=null
