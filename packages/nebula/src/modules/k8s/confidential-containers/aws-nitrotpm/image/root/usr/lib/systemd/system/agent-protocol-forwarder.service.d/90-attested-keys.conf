[Unit]
Requires=aws-trustee-bootstrap.service aws-caa-transport.service kata-agent.service
After=aws-trustee-bootstrap.service aws-caa-transport.service kata-agent.service
BindsTo=run-nebula-secrets.mount run-peerpod.mount

[Service]
EnvironmentFile=
ExecStart=
ExecStart=/usr/local/bin/agent-protocol-forwarder -config /run/peerpod/apf.json -pod-namespace /run/netns/podns -kata-agent-socket /run/kata-containers/agent.sock
ReadOnlyPaths=/run/peerpod
LimitCORE=0
StandardOutput=null
StandardError=null
