[Unit]
Requires=aws-trustee-bootstrap.service confidential-data-hub.service
After=aws-trustee-bootstrap.service confidential-data-hub.service
BindsTo=run-nebula-secrets.mount

[Service]
ExecStart=
ExecStart=/usr/local/bin/kata-agent --config /usr/share/nebula/agent.toml
ExecStopPost=
UnsetEnvironment=KATA_AGENT_POLICY_FILE
LimitCORE=0
StandardOutput=null
StandardError=null
