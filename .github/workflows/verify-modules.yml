name: Verify modules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-modules-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nebula:
    name: Tests, types and policies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/nebula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - name: Tests (including the packed-tarball import test)
        run: pnpm test
      - run: pnpm exec tsc --noEmit
      - name: Real Envoy mutual TLS qualification
        env:
          ENVOY_TEST_IMAGE: docker.io/envoyproxy/envoy@sha256:43b69cf424922cd5d1086cc019dc89197e58d58deac89d36b3c8b67f1a9e8523 # v1.39.2 amd64
        run: pnpm exec tsx --test test/envoy.integration.test.ts
      - run: pnpm verify:policies
      - name: Install pinned Rust for broker policy qualification
        run: rustup toolchain install 1.98.1 --profile minimal && rustup override set 1.98.1
      - name: Evaluate SNP admission with the broker's pinned policy and EAR engines
        run: pnpm verify:broker-admission

  aws-nitrotpm:
    name: AWS CoCo protocols and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/nebula/src/modules/k8s/confidential-containers/aws-nitrotpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: pip install -r requirements.lock -r control/requirements.lock
      - name: Reconciliation, interrupted operations and owned cleanup
        run: |
          python -m unittest discover -s control
          python -m unittest discover -s release
          python -m py_compile release/build.py release/canary.py release/complete.py release/stage.py
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt clippy
          rustup override set 1.98.1
      - name: Guest bootstrap checks
        run: |
          cargo fmt --manifest-path guest/Cargo.toml -- --check
          cargo test --locked --manifest-path guest/Cargo.toml --lib
          cargo clippy --locked --manifest-path guest/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --manifest-path guest/Cargo.toml --bin aws-trustee-bootstrap
      - name: Exercise protected journal and owner history against isolated software TPMs
        run: |
          cargo test --locked --manifest-path guest/Cargo.toml --lib --no-run --message-format=json > "$RUNNER_TEMP/nebula-guest-tests.jsonl"
          mkdir -p "$RUNNER_TEMP/nebula-tpm-test"
          python - "$RUNNER_TEMP/nebula-guest-tests.jsonl" "$RUNNER_TEMP/nebula-tpm-test/guest-tests" <<'PY'
          import json, pathlib, shutil, sys
          messages = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          binaries = [item["executable"] for item in messages if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["kind"] == ["lib"] and item["profile"]["test"]]
          assert len(binaries) == 1, "exactly one Rust library test binary required"
          shutil.copy2(binaries[0], sys.argv[2])
          # Only synthetic test keys: model a nonswappable guest without changing
          # the hosted runner's swap. Production still checks its real /proc.
          pathlib.Path(sys.argv[2]).with_name("swaps").write_text("Filename\tType\tSize\tUsed\tPriority\n")
          PY
          docker build -f guest/tests/tpm.Dockerfile -t nebula-authority-tpm-test guest/tests
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=128m \
            -v "$RUNNER_TEMP/nebula-tpm-test/swaps:/proc/swaps:ro" \
            -v "$RUNNER_TEMP/nebula-tpm-test:/tests:ro" -e NEBULA_SWTPM_TEST=1 \
            nebula-authority-tpm-test /tests/guest-tests --ignored emulator_
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify Node-signed workloads and owner history with the actual Rust guest
        working-directory: packages/nebula
        run: |
          npm install -g pnpm@11.9.0
          pnpm install --frozen-lockfile
          NEBULA_GUEST_BINARY="$PWD/src/modules/k8s/confidential-containers/aws-nitrotpm/guest/target/debug/aws-trustee-bootstrap" node --import tsx --test test/confidential-containers-workload.test.ts test/confidential-containers-authority.test.ts
      - name: Build the unmodified pinned Trustee KBS
        run: |
          git clone https://github.com/confidential-containers/trustee.git "$RUNNER_TEMP/trustee"
          git -C "$RUNNER_TEMP/trustee" checkout --detach 3b7c99069a7c89ea51713dcf7cf98c16dbe2d3db
          cargo build --locked --manifest-path "$RUNNER_TEMP/trustee/Cargo.toml" -p kbs --no-default-features --bin kbs
      - name: Synthetic evidence through stock KBS, guest client and offline KBC
        run: NEBULA_KBS_BINARY="$RUNNER_TEMP/trustee/target/debug/kbs" python -m pytest -q tests

  aws-nitro-owner:
    name: AWS Nitro attestation with protected TPM owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/nebula/src/modules/k8s/confidential-containers/aws-nitrotpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare exact reviewed Nitro source and TPM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtss2-dev clang
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          python3 release/nitro.py --work "$RUNNER_TEMP/nitro-source"
      - name: Build the real patched attester and test binary
        run: |
          cargo build --locked --manifest-path "$RUNNER_TEMP/nitro-source/nitro-tpm-tools/Cargo.toml" -p nitro-tpm-attest --bin nitro-tpm-attest
          cargo test --locked --manifest-path "$RUNNER_TEMP/nitro-source/nitro-tpm-tools/Cargo.toml" -p nitro-tpm-attest --lib --no-run --message-format=json > "$RUNNER_TEMP/nitro-tests.jsonl"
          mkdir -p "$RUNNER_TEMP/nitro-test"
          python3 - "$RUNNER_TEMP/nitro-tests.jsonl" "$RUNNER_TEMP/nitro-test/attester-tests" <<'PY'
          import json, pathlib, shutil, sys
          messages = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          binaries = [item["executable"] for item in messages if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["kind"] == ["lib"] and item["profile"]["test"]]
          assert len(binaries) == 1, "exactly one attester library test binary required"
          shutil.copy2(binaries[0], sys.argv[2])
          PY
      - name: Reject wrong owner auth and preserve authenticated cleanup after context recreation
        run: |
          docker build -f guest/tests/tpm.Dockerfile -t nebula-nitro-owner-test guest/tests
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=64m \
            -v "$RUNNER_TEMP/nitro-test:/tests:ro" -v "$PWD/release/test-nitro-owner.sh:/test.sh:ro" \
            nebula-nitro-owner-test sh /test.sh /tests/attester-tests

  aws-tpm-state:
    name: AWS authority software TPM experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Use container confinement and a private memory fixture. The host's swtpm
    # AppArmor profile does not permit /dev/shm; do not disable that profile.
    container:
      image: ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 # 24.04
      options: --security-opt no-new-privileges --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=128m
    defaults:
      run:
        working-directory: packages/nebula/src/modules/k8s/confidential-containers/aws-nitrotpm
    steps:
      - name: Install isolated TPM emulator and Python
        working-directory: /tmp
        run: |
          apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends git ca-certificates python3-venv swtpm tpm2-tools libtss2-tcti-swtpm0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned test dependencies
        run: |
          python3 -m venv /opt/tpm-tests
          /opt/tpm-tests/bin/pip install -r requirements.lock
      - name: Check seal, NV history, graceful/abrupt restart, cloning and boot rejection
        run: NEBULA_SWTPM_TEST=1 /opt/tpm-tests/bin/python -m pytest -q tests/test_tpm_persistence.py

  bridge:
    name: Bridge tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docker/devops-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt httpx
      - run: python -m unittest discover -s tests

  publication-guard:
    name: Publication guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Guard self-test
        run: node --test scripts/publication-guard.test.mjs
      - name: Scan module paths
        run: node scripts/publication-guard.mjs
      - name: Scan pull request title, branch, body and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          printf '%s\n' "$PR_TITLE" "$HEAD_REF" "$PR_BODY" | node scripts/publication-guard.mjs --stdin --label pull-request
          git log --format=%B "$BASE_SHA..$HEAD_SHA" | node scripts/publication-guard.mjs --stdin --label commit-messages
      - name: Scan pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail
          if [ -z "${BEFORE//0/}" ]; then set -- -1 "$AFTER"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then set -- "$BEFORE..$AFTER"
          else set -- "$AFTER"; fi
          git log --format=%B "$@" | node scripts/publication-guard.mjs --stdin --label commit-messages

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            range="$BEFORE..$AFTER"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            range="$AFTER"
          else
            range="-1 $AFTER"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .
