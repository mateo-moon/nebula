name: Verify modules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-modules-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nebula:
    name: Tests, types and policies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/nebula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - name: Check provisioning Python style and types
        run: |
          python3 -m venv "$RUNNER_TEMP/nebula-python"
          "$RUNNER_TEMP/nebula-python/bin/pip" install -r test/requirements-python.txt
          "$RUNNER_TEMP/nebula-python/bin/ruff" check src/modules/infra/k0s/baremetal test/baremetal*.py
          "$RUNNER_TEMP/nebula-python/bin/ruff" format --check src/modules/infra/k0s/baremetal test/baremetal*.py
          "$RUNNER_TEMP/nebula-python/bin/mypy"
      - name: Install verified Crossplane CLI for composition pipeline tests
        run: |
          curl --fail --location --retry 3 https://releases.crossplane.io/stable/v2.1.3/bin/linux_amd64/crank --output "$RUNNER_TEMP/crossplane"
          printf 'fe3ac3abde4ed48df87583c2392f1a17cb968115f58511243dc29783c0350013  %s\n' "$RUNNER_TEMP/crossplane" | sha256sum --check
          chmod +x "$RUNNER_TEMP/crossplane"
      - name: Pull composition function runtimes
        run: |
          for image in \
            xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.9.0 \
            xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.4.2; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 15))"
            done
          done
      - name: Tests (including the packed-tarball import test)
        env:
          ECR_READER_CONTAINER_TEST: "1"
          BAREMETAL_CROSSPLANE_CLI: ${{ runner.temp }}/crossplane
        run: pnpm test
      - run: pnpm exec tsc --noEmit
      - name: Real Envoy mutual TLS qualification
        env:
          ENVOY_TEST_IMAGE: docker.io/envoyproxy/envoy@sha256:43b69cf424922cd5d1086cc019dc89197e58d58deac89d36b3c8b67f1a9e8523 # v1.39.2 amd64
        run: pnpm exec tsx --test test/envoy.integration.test.ts
      - run: pnpm verify:policies
      - name: Install pinned Rust for broker policy qualification
        run: rustup toolchain install 1.98.1 --profile minimal && rustup override set 1.98.1
      - name: Evaluate SNP admission with the broker's pinned policy and EAR engines
        run: pnpm verify:broker-admission

  bridge:
    name: Bridge tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docker/devops-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt httpx
      - run: python -m unittest discover -s tests

  publication-guard:
    name: Publication guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Guard self-test
        run: node --test scripts/publication-guard.test.mjs
      - name: Scan module paths
        run: node scripts/publication-guard.mjs
      - name: Scan pull request title, branch, body and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          printf '%s\n' "$PR_TITLE" "$HEAD_REF" "$PR_BODY" | node scripts/publication-guard.mjs --stdin --label pull-request
          git log --format=%B "$BASE_SHA..$HEAD_SHA" | node scripts/publication-guard.mjs --stdin --label commit-messages
      - name: Scan pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail
          if [ -z "${BEFORE//0/}" ]; then set -- -1 "$AFTER"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then set -- "$BEFORE..$AFTER"
          else set -- "$AFTER"; fi
          git log --format=%B "$@" | node scripts/publication-guard.mjs --stdin --label commit-messages

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            range="$BEFORE..$AFTER"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            range="$AFTER"
          else
            range="-1 $AFTER"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .
