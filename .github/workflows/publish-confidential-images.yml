name: Publish confidential workload images

on:
  push:
    branches: [main]
    paths:
      - packages/confidential-operator/**
      - packages/confidential-runtime/**
      - packages/confidential-storage/**
      - packages/confidential-storage-devices/**
      - packages/confidential-client/**
      - packages/confidential-browser/**
      - packages/nebula/src/modules/k8s/confidential-workloads/**
      - packages/nebula/src/modules/k8s/trustee/**
      - packages/nebula/src/modules/k8s/confidential-guests/**
      - packages/nebula/src/modules/k8s/envoy/**
      - packages/nebula/src/core/**
      - packages/nebula/src/utils/**
      - packages/nebula/imports/**
      - packages/nebula/package.json
      - packages/nebula/pnpm-lock.yaml
      - packages/nebula/pnpm-workspace.yaml
      - docker/confidential-operator/**
      - docker/confidential-runtime/**
      - docker/confidential-storage/**
      - docker/confidential-storage-devices/**
      - docker/confidential-browser/**
      - .dockerignore
      - .github/workflows/publish-confidential-images.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Check measured image sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/check-confidential-docker-bases.mjs
      - name: Scan source and build contexts before publication
        run: >-
          node scripts/publication-guard.mjs
          packages/confidential-operator packages/confidential-runtime
          packages/confidential-storage packages/confidential-storage-devices
          packages/confidential-client packages/confidential-browser
          packages/nebula/package.json packages/nebula/src/core/base-construct.ts
          packages/nebula/src/utils/secrets.ts
          packages/nebula/src/modules/k8s/confidential-guests
          packages/nebula/src/modules/k8s/confidential-workloads
          packages/nebula/src/modules/k8s/trustee
          packages/nebula/src/modules/k8s/envoy/measured-fragments.ts
          docker/confidential-operator docker/confidential-runtime
          docker/confidential-storage docker/confidential-storage-devices
          docker/confidential-browser
          .dockerignore

  publish:
    name: Publish ${{ matrix.role }} (linux/amd64)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [operator, runtime, storage, storage-devices, browser]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: image
        with:
          context: .
          file: docker/confidential-${{ matrix.role }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nebula-confidential-${{ matrix.role }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=confidential-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=confidential-${{ matrix.role }}
      - name: Record the immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ROLE: ${{ matrix.role }}
          OWNER: ${{ github.repository_owner }}
        run: |
          test -n "$DIGEST"
          printf 'nebula-confidential-%s: ghcr.io/%s/nebula-confidential-%s@%s\n' \
            "$ROLE" "$OWNER" "$ROLE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
