name: Publish nebula-cmp image

on:
  push:
    branches: [main]
    paths:
      - docker/nebula-cmp/**
      - .github/workflows/publish-nebula-cmp.yml
  workflow_dispatch:
    inputs:
      helm_version:
        description: Helm version
        default: "3.17.0"
      vals_version:
        description: Vals version
        default: "0.43.1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nebula-cmp

jobs:
  guard:
    name: Publication guard (build context)
    # Manual dispatch qualifies a reviewed PR image before GitOps adoption.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      helm_version: ${{ steps.versions.outputs.helm_version }}
      vals_version: ${{ steps.versions.outputs.vals_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate the build versions
        id: versions
        env:
          HELM_VERSION: ${{ inputs.helm_version || '3.17.0' }}
          VALS_VERSION: ${{ inputs.vals_version || '0.43.1' }}
        run: |
          for v in "$HELM_VERSION" "$VALS_VERSION"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::helm_version and vals_version must be release versions (N.N.N)"; exit 1; }
          done
          echo "helm_version=$HELM_VERSION" >> "$GITHUB_OUTPUT"
          echo "vals_version=$VALS_VERSION" >> "$GITHUB_OUTPUT"
      - name: Scan the image build context
        run: env -u GITHUB_REPOSITORY_OWNER node scripts/publication-guard.mjs docker/nebula-cmp

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compile native genpolicy on each architecture, without QEMU.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: image
        with:
          context: docker/nebula-cmp
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=nebula-cmp-${{ matrix.arch }}
          cache-to: type=gha,scope=nebula-cmp-${{ matrix.arch }},mode=max
          provenance: false
          build-args: |
            HELM_VERSION=${{ needs.guard.outputs.helm_version }}
            VALS_VERSION=${{ needs.guard.outputs.vals_version }}

      - name: Record platform digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmp-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cmp-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REVISION: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          args=(-t "$IMAGE:${REVISION:0:7}")
          if [ "$REF" = refs/heads/main ]; then args+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" = 2
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${REVISION:0:7}" >> "$GITHUB_STEP_SUMMARY"
