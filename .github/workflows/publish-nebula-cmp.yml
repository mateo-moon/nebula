name: Publish nebula-cmp image

on:
  push:
    branches: [main]
    paths:
      - docker/nebula-cmp/**
      - .github/workflows/publish-nebula-cmp.yml
  workflow_dispatch:
    inputs:
      helm_version:
        description: Helm version
        default: "3.17.0"
      vals_version:
        description: Vals version
        default: "0.43.1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nebula-cmp

jobs:
  guard:
    name: Publication guard (build context)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      helm_version: ${{ steps.versions.outputs.helm_version }}
      vals_version: ${{ steps.versions.outputs.vals_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate the build versions
        id: versions
        env:
          HELM_VERSION: ${{ inputs.helm_version || '3.17.0' }}
          VALS_VERSION: ${{ inputs.vals_version || '0.43.1' }}
        run: |
          for v in "$HELM_VERSION" "$VALS_VERSION"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::helm_version and vals_version must be release versions (N.N.N)"; exit 1; }
          done
          echo "helm_version=$HELM_VERSION" >> "$GITHUB_OUTPUT"
          echo "vals_version=$VALS_VERSION" >> "$GITHUB_OUTPUT"
      - name: Scan the image build context
        run: env -u GITHUB_REPOSITORY_OWNER node scripts/publication-guard.mjs docker/nebula-cmp

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Multi-arch (amd64 + arm64): QEMU for emulation, buildx as the builder.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: docker/nebula-cmp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            HELM_VERSION=${{ needs.guard.outputs.helm_version }}
            VALS_VERSION=${{ needs.guard.outputs.vals_version }}
