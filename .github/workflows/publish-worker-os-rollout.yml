name: Publish worker OS rollout runtime

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Reviewed Debian multi-architecture base pinned by sha256
        required: true

permissions:
  contents: read

jobs:
  guard:
    if: github.ref == 'refs/heads/main' && vars.WORKER_OS_ROLLOUT_IMAGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the base image pin
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: node -e 'if (!/^docker.io\/library\/debian@sha256:[a-f0-9]{64}$/.test(process.env.BASE_IMAGE)) process.exit(1)'
      - name: Scan the image build context
        run: env -u GITHUB_REPOSITORY_OWNER node scripts/publication-guard.mjs packages/nebula/src/modules/infra/aws/worker-os-rollout

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: packages/nebula/src/modules/infra/aws/worker-os-rollout
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nebula-worker-os-rollout:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          provenance: false
