name: Build native TNG client

on:
  pull_request:
    paths:
      - tools/tng-client/**
      - packages/confidential-client/**
      - packages/nebula/package.json
      - packages/nebula/src/modules/k8s/trustee/client-plan.ts
      - packages/nebula/src/modules/k8s/trustee/policies.ts
      - .github/workflows/build-tng-client.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-tng-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native TNG artifact (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Check source publication boundary
        run: node scripts/publication-guard.mjs tools/tng-client packages/confidential-client
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config protobuf-compiler libprotobuf-dev libssl-dev
          rustup toolchain install 1.98.1 --profile minimal
      - name: Build and test the pinned runtime
        run: sh tools/tng-client/build.sh "$RUNNER_TEMP/tng-source" "$RUNNER_TEMP/native-artifact"
      - name: Qualify the artifact with the Node client and native Trustee AS
        working-directory: packages/confidential-client
        env:
          TNG_TEST_BINARY: ${{ runner.temp }}/native-artifact/tng
          TRUSTEE_TEST_IMAGE: ghcr.io/confidential-containers/staged-images/kbs@sha256:ebbb0b34c748ce59a6afcaf05c1cc6f6c66ee6aa2c70222fd160700a296edd68
        run: |
          npm install -g pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Archive the qualified binary and checksums
        run: tar -czf "$RUNNER_TEMP/tng-client-linux-amd64.tar.gz" -C "$RUNNER_TEMP/native-artifact" tng LICENSE BUILD.txt SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tng-client-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/tng-client-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
