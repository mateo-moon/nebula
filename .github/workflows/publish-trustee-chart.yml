name: Publish Trustee Helm dependency

on:
  push:
    branches: [main]
    paths: [.github/trustee-chart.json]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  chart:
    uses: ./.github/workflows/build-trustee-chart.yml

  publish:
    needs: chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.chart.outputs.artifact }}
          path: ${{ runner.temp }}/trustee-chart
      - name: Publish the existing official package through Helm OCI
        working-directory: ${{ runner.temp }}/trustee-chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.chart.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "trustee-$VERSION.tgz" "oci://ghcr.io/$REPOSITORY_OWNER/helm" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
